<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden findes ikke — Jacob Bøtter</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#191612">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<style>
  .notfound {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(24px, 4vw, 64px);
  }
  .notfound h1 {
    margin: 0 0 clamp(20px, 4vh, 36px);
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(40px, 6vw, 88px);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .notfound p {
    margin: 0 0 clamp(28px, 4vh, 36px);
    font-size: clamp(16px, 1.4vw, 19px);
    line-height: 1.55;
    color: #B8AE9F;
    max-width: 42ch;
  }
</style>
</head>
<body>
<main class="notfound">
  <span class="eyebrow">404</span>
  <h1>Den side findes ikke.</h1>
  <p>Måske er den flyttet — eller måske har den aldrig eksisteret. Forsiden findes til gengæld helt sikkert.</p>
  <a class="btn" href="/">Til forsiden</a>
</main>
</body>
</html>
